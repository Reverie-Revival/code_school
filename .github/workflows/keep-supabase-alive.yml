name: Keep Supabase alive

# family_hub is a free-tier Supabase project, which auto-pauses after 7 days
# with no database activity (see CLAUDE.md). History, in order of what
# didn't work:
#   - anon-key read, twice a week (2026-08-25): warning arrived anyway.
#   - service_role write via PostgREST, twice a week (2026-09-14): warning
#     arrived anyway (2026-09-29), despite every write verifiably landing.
#   - same service_role write, switched to daily (2026-09-29): warning
#     arrived again (2026-10-12), with 12 straight daily writes verified
#     successful and zero gaps.
# Every attempt so far went through Supabase's REST API (PostgREST), just
# with different keys/cadence. Switching to a direct Postgres wire
# connection (psql) instead -- a fundamentally different channel that
# can't be filtered by whatever PostgREST-layer nuance (key role, RLS,
# schema cache) has been silently discarding the REST-based pings.
on:
  schedule:
    - cron: "0 13 * * *" # Daily, 13:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write keepalive row via direct Postgres connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c \
            "insert into code_school.keepalive (id, pinged_at) values (1, now())
             on conflict (id) do update set pinged_at = excluded.pinged_at;"
