name: Keep Supabase alive

# family_hub is a free-tier Supabase project, which auto-pauses after 7 days
# with no database activity (see CLAUDE.md). This just does a trivial read
# twice a week so it never goes quiet long enough to trip that.
on:
  schedule:
    - cron: "0 13 * * 1,4" # Monday and Thursday, 13:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping family_hub Supabase project
        env:
          SUPABASE_URL: https://dpwbqfrwmlvqkfkcvfuy.supabase.co
          # Public anon key, same one already checked into js/config.js.
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwd2JxZnJ3bWx2cWtma2N2ZnV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMjM5NDcsImV4cCI6MjA5OTg5OTk0N30.w1SOLAWiOpkp_j3Xggc5fxx3otwj6U_2idmb3cr9yXc
        run: |
          curl -sf \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Accept-Profile: code_school"
