name: Keep Supabase alive

# family_hub is a free-tier Supabase project, which auto-pauses after 7 days
# with no database activity (see CLAUDE.md). A read-only SELECT (even one
# that succeeds daily with HTTP 200) turned out NOT to count against
# Supabase's auto-pause activity metric -- learned the hard way on the
# Reverie Revival project. This does a real write instead, via the
# service_role key, to a dedicated code_school.keepalive table that no
# client-side code can ever touch (RLS enabled, zero policies).
on:
  schedule:
    - cron: "0 13 * * 1,4" # Monday and Thursday, 13:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write keepalive row in family_hub Supabase project
        env:
          SUPABASE_URL: https://dpwbqfrwmlvqkfkcvfuy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sf \
            -X POST \
            "$SUPABASE_URL/rest/v1/keepalive" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Profile: code_school" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d '{"id": 1, "pinged_at": "'"$(date -u +%FT%TZ)"'"}'
      - name: TEMP debug -- print keepalive row
        env:
          SUPABASE_URL: https://dpwbqfrwmlvqkfkcvfuy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -s \
            "$SUPABASE_URL/rest/v1/keepalive?select=*" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Accept-Profile: code_school" \
            -w "\nHTTP:%{http_code}\n"
